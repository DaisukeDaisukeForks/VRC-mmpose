name: Check static source
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check shipped JavaScript syntax
        run: find dist -name '*.js' -not -path '*/vendor/*' -print0 | xargs -0 -n1 node --check
