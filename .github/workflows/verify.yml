name: Verify Phase 1
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geometry-and-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and source contracts
        run: |
          find dist -name '*.js' -not -path '*/vendor/*' -print0 | xargs -0 -n1 node --check
          node --check serve.mjs
          node --test tests/*.test.mjs
  onnx-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install onnx==1.17.0 onnxruntime==1.23.2 numpy==2.2.6 pillow==11.3.0
      - name: Install sample video decoder
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: actions/cache@v4
        with:
          path: .model-cache
          key: instanthmr-3504446f
      - name: Verify original InstantHMR and actual CPU inference
        run: python scripts/verify-instanthmr.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test browser decoder against actual model reference
        run: node --test tests/*.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: instanthmr-numerical-verification
          path: verification/instant/
  browser-numerical:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Actual WebGPU numerical inference and cache reuse (no visual verification)
        run: node scripts/verify-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instanthmr-browser-numerical
          path: verification/instant/browser-numerical.json
